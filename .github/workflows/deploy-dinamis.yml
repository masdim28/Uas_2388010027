name: Deploy Laravel

on:
  push:
    paths:
      - 'web-dinamis/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build \
          -t masdimas27/dinamis-2388010027:latest \
          ./web-dinamis

      - name: Push Image
        run: |
          docker push masdimas27/dinamis-2388010027:latest

      - name: Deploy EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/uas
            docker pull masdimas27/dinamis-2388010027:latest
            docker compose down
            docker compose up -d
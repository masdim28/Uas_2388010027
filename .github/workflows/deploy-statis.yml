name: Deploy Web Statis

on:
  push:
    paths:
      - 'web-statis/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build \
          -t masdimas27/statis-2388010027:latest \
          ./web-statis

      - name: Push Image
        run: |
          docker push masdimas27/statis-2388010027:latest
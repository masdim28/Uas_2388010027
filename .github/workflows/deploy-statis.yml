name: Deploy Web Statis

on:
  push:
    paths:
      - 'web-statis/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Image
      run: |
        docker build -t masdim27/statis-2388010027:latest ./web-statis

    - name: Push Image
      run: |
        docker push masdim27/statis-2388010027:latest